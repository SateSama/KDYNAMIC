name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installer les dépendances
        run: npm install

      - name: Générer les icônes
        run: npx tauri icon app-icon.png

      - name: Compiler l'application
        run: npx tauri build

      - name: Sauvegarder les fichiers générés
        uses: actions/upload-artifact@v4
        with:
          name: PC-Dynamic-Island-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/pc-dynamic-island.exe

      - name: Publier la release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/pc-dynamic-island.exe
          generate_release_notes: true
